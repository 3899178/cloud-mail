name: Mail sync Linux acceptance candidate
on:
  pull_request:
  push:
    branches: [codex/unified-mail, main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: mail-sync-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run secret-free exact-image and cgroup gates
        shell: bash
        run: bash deploy/ci.sh
