name: Publish reviewed public service image
on:
  push:
    tags: ['mail-sync-preview-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mail-sync-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == '3899178/cloud-mail' && github.actor == '3899178' &&
      ((github.event_name == 'push' && github.ref == format('refs/tags/mail-sync-preview-{0}', github.sha)) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Owner must configure a real required-reviewer rule BEFORE creating a tag.
    environment: public-image-release
    permissions:
      contents: read
      packages: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
      digest: ${{ steps.publish.outputs.digest }}
      testedImageID: ${{ steps.publish.outputs.testedImageID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Accept exact runtime image with full Linux gates
        shell: bash
        run: node deploy/publication.mjs accept
      - name: Push the same accepted image without rebuilding
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: node deploy/publication.mjs publish
  verify-public:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify anonymous manifest config and immutable pull
        shell: bash
        env:
          PUBLIC_SOURCE: ${{ needs.publish.outputs.source }}
          PUBLIC_DIGEST: ${{ needs.publish.outputs.digest }}
          PUBLIC_TESTED_IMAGE_ID: ${{ needs.publish.outputs.testedImageID }}
        run: node deploy/publication.mjs verify
